<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#030b1b">
    <title>Sign in | Inventory Manager</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <main class="login-page">
        <div class="login-topbar"><button class="theme-button" type="button" data-theme-toggle aria-label="Toggle theme" title="Toggle theme"><span data-theme-icon aria-hidden="true">☀</span></button></div>
        <section class="login-content" aria-labelledby="pageTitle">
            <header class="login-brand">
                <a class="brand-mark" href="../index.html" aria-label="Back to Inventory Manager home"><svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 5 40 14v20L24 43 8 34V14L24 5Z" stroke="currentColor" stroke-width="2.5"/><path d="m15 24 6 6 12-13" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
                <h1 id="pageTitle">Welcome back</h1>
                <p>Sign in to manage your stock and sales</p>
            </header>
            <div class="login-card">
                <p class="form-message" id="formMessage" role="status" hidden></p>
                <form class="form" id="loginForm">
                    <div class="field"><label for="username">Username</label><div class="input-wrap"><span aria-hidden="true">✉</span><input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" required></div><small class="hint">Use the username linked to your Inventory Manager account</small></div>
                    <div class="field"><label for="password">Password</label><div class="input-wrap"><span aria-hidden="true">▣</span><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required></div></div>
                    <button class="button button-primary" type="submit">Sign in</button>
                </form>
                <footer class="login-footer"><p>Don't have an account? <a href="#register">Register here</a></p><div class="divider"></div><a href="../index.html">← Back to home</a></footer>
            </div>
        </section>
    </main>
    <script src="../assets/js/app.js"></script>
</body>
</html>
